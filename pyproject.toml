[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loglens"
version = "0.1.0"
description = "Evidence-grounded AI analysis for software log collections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LogLens Contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
loglens = "loglens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/loglens"]

[tool.ruff]
src = ["backend"]

[tool.ruff.lint.isort]
known-first-party = ["loglens"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

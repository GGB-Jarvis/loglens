services:
  loglens:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOGLENS_DATA_DIR: /app/data
      LOGLENS_LLM_BASE_URL: ${LOGLENS_LLM_BASE_URL:-}
      LOGLENS_LLM_MODEL: ${LOGLENS_LLM_MODEL:-}
      LOGLENS_LLM_API_KEY: ${LOGLENS_LLM_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./packs:/app/packs:ro
    restart: unless-stopped
